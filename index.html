<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>牧网守正后台管理系统</title>
    <meta name="description" content="牧网守正后台管理系统 - 机构管理" />
    <script>
      (function() {
        try {
          var _currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  </head>
  <body class="flex h-screen overflow-x-auto overflow-y-hidden text-sm text-[#333333] bg-[#f0f2f5] min-w-[1366px]">
    <div id="root" class="flex h-full w-full min-w-[1366px]"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
